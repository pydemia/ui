name: Verify UI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Determine verification scope
        id: scope
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE_SHA: ${{ github.event.before }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            BASE_SHA="$PR_BASE_SHA"
          else
            BASE_SHA="$PUSH_BASE_SHA"
          fi
          full=true
          if [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]] &&
             [[ "$BASE_SHA" != 0000000000000000000000000000000000000000 ]]; then
            if ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
              git fetch --no-tags --depth=1 origin "$BASE_SHA" || true
            fi
            if git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null &&
               git diff --no-renames --name-only -z "$BASE_SHA" HEAD > "$RUNNER_TEMP/changed-paths"; then
              full=false
              found=false
              while IFS= read -r -d '' path; do
                found=true
                case "$path" in
                  .worknotes/*.md|research/*.md|README.md|CHANGELOG.md|NEXT_SESSION.md)
                    ;;
                  *) full=true ;;
                esac
              done < "$RUNNER_TEMP/changed-paths"
              if [[ "$found" == false ]]; then full=true; fi
              echo "base=$BASE_SHA" >> "$GITHUB_OUTPUT"
            fi
          fi
          echo "full=$full" >> "$GITHUB_OUTPUT"
          echo "Full verification: $full"
      - name: Check changed diff
        if: steps.scope.outputs.base != ''
        env:
          BASE_SHA: ${{ steps.scope.outputs.base }}
        run: git diff --check "$BASE_SHA" HEAD
      - uses: actions/setup-node@v7
        if: steps.scope.outputs.full == 'true'
        with:
          node-version: 24
          cache: npm
      - run: npm ci
        if: steps.scope.outputs.full == 'true'
      - run: npm run typecheck
        if: steps.scope.outputs.full == 'true'
      - run: npm run test -w @pydemia/ui
        if: steps.scope.outputs.full == 'true'
      - run: npm run build
        if: steps.scope.outputs.full == 'true'
      - name: Verify registry and published snapshots
        if: steps.scope.outputs.full == 'true'
        run: npm run registry:check
      - name: Verify current release candidate
        if: ${{ steps.scope.outputs.full == 'true' && (github.event_name == 'push' || !github.event.pull_request.draft) }}
        run: node scripts/registry-release.mjs verify-current
      - run: git diff --exit-code -- docs
        if: steps.scope.outputs.full == 'true'
      - run: test -z "$(git ls-files --others --exclude-standard -- docs)"
        if: steps.scope.outputs.full == 'true'
