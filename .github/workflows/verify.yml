name: Verify UI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test -w @pydemia/ui
      - run: npm run build
      - name: Verify registry and published snapshots
        run: npm run registry:check
      - name: Verify current release candidate
        if: ${{ github.event_name == 'push' || !github.event.pull_request.draft }}
        run: node scripts/registry-release.mjs verify-current
      - run: git diff --exit-code -- docs
      - run: test -z "$(git ls-files --others --exclude-standard -- docs)"
