name: Verify UI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Determine pull request scope
        id: scope
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            git fetch --no-tags --depth=1 origin "$BASE_SHA"
          fi
          git cat-file -e "$BASE_SHA^{commit}"
          full=false
          found=false
          while IFS= read -r -d '' path; do
            found=true
            case "$path" in
              .worknotes/*.md|research/*.md|README.md|CHANGELOG.md|NEXT_SESSION.md)
                ;;
              *) full=true ;;
            esac
          done < <(git diff --name-only -z "$BASE_SHA" HEAD)
          if [[ "$found" == false ]]; then full=true; fi
          echo "full=$full" >> "$GITHUB_OUTPUT"
          echo "Full verification: $full"
      - name: Check pull request diff
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: git diff --check "$BASE_SHA" HEAD
      - uses: actions/setup-node@v7
        if: github.event_name == 'push' || steps.scope.outputs.full == 'true'
        with:
          node-version: 24
          cache: npm
      - run: npm ci
        if: github.event_name == 'push' || steps.scope.outputs.full == 'true'
      - run: npm run typecheck
        if: github.event_name == 'push' || steps.scope.outputs.full == 'true'
      - run: npm run test -w @pydemia/ui
        if: github.event_name == 'push' || steps.scope.outputs.full == 'true'
      - run: npm run build
        if: github.event_name == 'push' || steps.scope.outputs.full == 'true'
      - name: Verify registry and published snapshots
        if: github.event_name == 'push' || steps.scope.outputs.full == 'true'
        run: npm run registry:check
      - name: Verify current release candidate
        if: ${{ (github.event_name == 'push' || steps.scope.outputs.full == 'true') && (github.event_name == 'push' || !github.event.pull_request.draft) }}
        run: node scripts/registry-release.mjs verify-current
      - run: git diff --exit-code -- docs
        if: github.event_name == 'push' || steps.scope.outputs.full == 'true'
      - run: test -z "$(git ls-files --others --exclude-standard -- docs)"
        if: github.event_name == 'push' || steps.scope.outputs.full == 'true'
